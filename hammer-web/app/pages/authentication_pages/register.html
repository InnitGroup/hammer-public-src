{% extends '__layout__.html' %}
{% block title %}Register{% endblock %}
{% block head %}
<script src="{{url_for('static',filename='js/register_page_handler.js', _scheme = 'https')}}"></script>
<script async src="https://mcl.spur.us/d/mcl.js?tk={{monocle_site_token}}" id="_mcl"></script>
{% endblock %}
{% block content %}
<div class="flex items-center justify-center h-screen">
    <div class="w-full max-w-sm">
        <h1 class="text-4xl font-semibold text-center mb-4 italic drop-shadow-md">hammer</h1>
        <div class="bg-white rounded-md px-8 pt-6 pb-8 mb-2 border shadow-md border-gray-300" id="register-container">
            <div class="mb-2">
                <label class="flex text-gray-700 text-sm font-medium mb-1 items-center" for="username">
                    Username
                    <p class="text-red-500 text-xs w-full text-end font-semibold hidden" id="username-input-error-text"></p>
                </label>
                <input class="shadow-md appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-indigo-700" id="username" type="text" placeholder="Username">
            </div>
            <div class="mb-2">
                <label class="flex text-gray-700 text-sm font-medium mb-1 items-center" for="password">
                    Password
                    <p class="text-red-500 text-xs w-full text-end font-semibold hidden" id="password-input-error-text"></p>
                </label>
                <input class="shadow-md appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-indigo-700" id="password" type="password" placeholder="************">
            </div>
            <div class="mb-3">
                <div class="flex items-center mb-1">
                    <label class="text-gray-700 text-sm font-medium whitespace-nowrap" for="confirm-password">
                        Confirm Password
                    </label>
                    <p class="text-red-500 text-xs w-full text-end font-semibold hidden" id="confirm-password-input-error-text"></p>
                </div>
                <input class="shadow-md appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-indigo-700" id="confirm-password" type="password" placeholder="************">
            </div>
            <div class="mb-3">
                <div class="flex items-center mb-1">
                    <label class="text-gray-700 text-sm font-medium whitespace-nowrap" for="invite-key">
                        Invite Key
                    </label>
                    <p class="text-red-500 text-xs w-full text-end font-semibold hidden" id="invite-key-input-error-text"></p>
                </div>
                <input class="shadow-md appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-indigo-700" id="invite-key" type="password" placeholder="hammer-abcdef123456789">
            </div>
            <div class="flex items-center px-1">
                <label class="text-gray-700 text-xs font-medium mb-1" for="agreeTermsAndPrivacy">
                    <input type="checkbox" class="mr-1 leading-tight" id="agreeTermsAndPrivacy">
                    I agree to the <a href="/terms" class="text-indigo-500 hover:text-indigo-700">Terms of Service</a> and <a href="/privacy" class="text-indigo-500 hover:text-indigo-700">Privacy Policy</a>
                </label>
            </div>
            <div class="flex items-center mb-3 px-1">
                <label class="text-gray-700 text-xs font-medium mb-1" for="agreeAgeRequirement">
                    <input type="checkbox" class="mr-1 leading-tight" id="agreeAgeRequirement">
                    I confirm that I am at least 13 years old
                </label>
            </div>
            <p class="text-red-500 text-xs w-full text-center mb-2 font-semibold hidden" id="register-error-text"></p>
            <button class="bg-indigo-600 w-full p-1 rounded-md text-white font-semibold shadow-md hover:bg-indigo-700" id="register-button">Register</button>
            <p class="text-gray-700 text-xs w-full text-center mt-1">Already have an account? <a href="/login" class="text-indigo-500 hover:text-indigo-700 disabled:text-indigo-800">Login</a></p>
        </div>
        <p class="text-center text-gray-500 text-xs italic">
            &copy;2025 hammer. All rights reserved.
        </p>
    </div>
</div>
{% endblock %}
