{% extends '__layout__.html' %}
{% block title %}Admin{% endblock %}
{% block head %}
{% endblock %}
{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-[1200px] mx-auto">
        <div class="rounded-md shadow-md bg-white border border-gray-300 p-4 flex items-center">
            <img src="{{ url_for('thumbnails_roblox._headshot_avatar', _scheme='https', userId = current_user.id, format = 'webp', x = 100, y = 100 ) }}" width="80px" height="80px" class="rounded-full shadow-md border-gray-300 border" style="background-color: #d4d4d4;"/>
            <div class="ms-2 text-start">
                <h1 class="text-4xl font-bold">{{ current_user.username }}</h1>
                <p class="text-gray-800 text-sm m-0">Server Time: {{ datetime_utcnow().strftime('%d %B %Y %H:%M:%S UTC')  }}</p>
            </div>
            <div class="ms-auto">
                <h1 class="text-4xl font-bold">Admin Panel</h1>
            </div>
        </div>
    </div>
</div>
{% endblock %}
